apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-demo
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-demo
      targetRevision: 0.42.3
      helm:
        releaseName: otel-demo
        valueFiles:
          - $values/gitops/values-aks.yaml
    - repoURL: https://github.com/VeeraMaddula/opentelemetry-demo-aks.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-demo
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
